<!DOCTYPE html>
<html lang="en">
<head>
    
    <script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2026/02/11/15/20260211154042-F60SPD41.js" defer></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victor Meza | GenAI Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-color: #fcfdfc;
            --surface-color: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-green: #059669;
            --accent-purple: #7c3aed;
            
            --mesh-gradient: radial-gradient(at 0% 0%, rgba(5, 150, 105, 0.15) 0px, transparent 50%),
                             radial-gradient(at 100% 0%, rgba(124, 58, 237, 0.15) 0px, transparent 50%),
                             radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.1) 0px, transparent 50%),
                             radial-gradient(at 0% 100%, rgba(124, 58, 237, 0.1) 0px, transparent 50%);

            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --card-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-color);
            background-image: var(--mesh-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            color: var(--text-primary);
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        ul { list-style: none; }

        /* --- NAVIGATION --- */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            z-index: 1000;
        }

        .logo { font-weight: 800; font-size: 1.2rem; }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); }

        /* --- HERO SECTION --- */
        header {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 20px 20px;
        }

        .hero-content { max-width: 900px; animation: fadeInUp 1s ease-out; }

        section { padding: 6rem 5%; max-width: 1400px; margin: 0 auto; }

        /* --- CONTACT FORM --- */
        .contact-form-wrapper {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: var(--card-shadow);
            display: flex;
            justify-content: center;
        }

        .contact-form-wrapper iframe {
            width: 100%;
            max-width: 720px;
            border: none;
        }

        footer {
            border-top: 1px solid rgba(0,0,0,0.05);
            padding: 4rem 5%;
            text-align: center;
            background: white;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">VM.</div>
    <div class="nav-links">
        <a href="#about">Profile</a>
        <a href="#submissions">Work</a>
        <a href="#contact">Contact</a>
    </div>
</nav>

<section id="contact">
    <span class="section-label">Get in Touch</span>
    <h2 style="font-size: 2.5rem; margin-bottom: 2rem;">Contact for Consultation</h2>

    <div class="contact-form-wrapper">
        <iframe 
            src="https://docs.google.com/forms/d/e/1FAIpQLSeny-aT_PWwknqQZrYT90dqZX1eZ88YJSUE0p8Qfjpz2HJqdA/viewform?embedded=true"
            height="780">
            Loading…
        </iframe>
    </div>
</section>

<footer>
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Victor Meza</h2>
    <p style="color: var(--text-secondary); font-size: 0.9rem;">
        University of California, Davis &bull; Class of 2026
    </p>
</footer>

</body>
</html>
